  .p-safe { color: var(--border-gold); }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; max-width: 1200px; width: 100%; margin: 0 auto; }

        { id: "s_h7", cat: "High School Subjects", q: "Who wrote the dystopian novel '1984'?", opts: new Array("Aldous Huxley", "George Orwell", "Ray Bradbury", "William Golding"), ans: 1 },
        { id: "s_h8", cat: "Driver's Ed", q: "What does a solid yellow line on your side of the center line mean?", opts: new Array("Passing allowed anytime", "No passing allowed", "Lane ends ahead", "Carpool lane only"), ans: 1 },
        { id: "s_h9", cat: "Jujutsu Kaisen", q: "What is the name of Ryomen Sukuna's Domain Expansion?", opts: new Array("Idle Death Gamble", "Malevolent Shrine", "Self-Embodiment of Perfection", "Horizon of Skandha"), ans: 1 },
        { id: "s_h10", cat: "Misc Trivia", q: "Which country is home to the world's largest desert outside the polar regions?", opts: new Array("Australia", "Algeria - Sahara", "Saudi Arabia", "Mongolia"), ans: 1 }
      )
    }
  }
);
let phase = 'FF';
let ffIndex = 0;
let ffStartTime = 0;
let ffInterval = null;
let ffUserSeq = new Array();
let ffResults = new Array();

let activePlayerIdx = 0;
let currentQ = null;
let timeLeft = 20;
let timerInterval = null;
let isPaused = false;
let inputLocked = false;

function renderScoreboard() {
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = PLAYERS.map((p, idx) => {
    const isActive = (phase === 'HOTSEAT' && idx === activePlayerIdx) || (phase === 'FF' && idx === ffIndex);
    const currentCash = p.rung > 0 ? LADDER.at(p.rung - 1) : "$0";
    const safeCash = p.safeRung >= 0 ? LADDER.at(p.safeRung) : "$0";
    return `
      <div class="player-card ${isActive ? 'active' : ''}">
        <span class="hot-badge">${phase === 'FF' ? 'FASTEST FINGER' : 'IN HOT SEAT'}</span>
        <div class="p-name">${p.name} <span style="font-size:0.8rem; color:#94a3b8;">Age ${p.age}</span></div>
        <div class="p-stats">
          <span>Current: <span class="p-money">${currentCash}</span></span>
          <span>Safe: <span class="p-safe">${safeCash}</span></span>
          <span>Best: <strong>${p.bestCash}</strong></span>
        </div>
      </div>
    `;
  }).join('');
}

function startFFTurn() {
  phase = 'FF';
  renderScoreboard();
  const p = PLAYERS.at(ffIndex);
  ffUserSeq = new Array();
  document.getElementById('ffPlayerTitle').textContent = `${p.name}'s Turn - Age ${p.age}`;
  document.getElementById('ffPrompt').textContent = p.ffPuzzle.prompt;
  document.getElementById('ffSeq').innerHTML = '';

  const shuffled = p.ffPuzzle.items.slice().sort(() => Math.random() - 0.5);
  const optContainer = document.getElementById('ffOptions');
  optContainer.innerHTML = shuffled.map(item => `
    <button class="ff-btn" onclick="pickFFItem(this, '${item.replace(/'/g, "\\'")}')">${item}</button>
  `).join('');

  ffStartTime = performance.now();
  clearInterval(ffInterval);
  ffInterval = setInterval(() => {
    if (!isPaused) {
      const elapsed = ((performance.now() - ffStartTime) / 1000).toFixed(1);
      document.getElementById('ffTimer').textContent = `${elapsed}s`;
    }
  }, 100);
}

function pickFFItem(btn, item) {
  if (isPaused) return;
  SFX.tick();
  btn.disabled = true;
  ffUserSeq.push(item);
  const pill = document.createElement('span');
  pill.className = 'seq-pill';
  pill.textContent = `${ffUserSeq.length}. ${item}`;
  document.getElementById('ffSeq').appendChild(pill);

  if (ffUserSeq.length === 4) {
    clearInterval(ffInterval);
    const timeTaken = parseFloat(((performance.now() - ffStartTime) / 1000).toFixed(2));
    const correctOrder = PLAYERS.at(ffIndex).ffPuzzle.correctOrder;
    let score = 0;
    ffUserSeq.forEach((val, i) => { if (val === correctOrder.at(i)) score++; });
    ffResults.push({ idx: ffIndex, name: PLAYERS.at(ffIndex).name, score, time: timeTaken });

    setTimeout(() => {
      ffIndex++;
      if (ffIndex < PLAYERS.length) {
        startFFTurn();
      } else {
        finishFastestFinger();
      }
    }, 600);
  }
}

function resetFFChoice() {
  if (isPaused) return;
  ffUserSeq = new Array();
  document.getElementById('ffSeq').innerHTML = '';
  document.querySelectorAll('.ff-btn').forEach(b => b.disabled = false);
}

function finishFastestFinger() {
  ffResults.sort((a, b) => b.score - a.score || a.time - b.time);
  const winner = ffResults.at(0);
  activePlayerIdx = winner.idx;

  const summary = ffResults.map((r, i) => `<p style="margin:6px 0;"><strong>#${i+1} ${r.name}:</strong> ${r.score}/4 right in ${r.time}s</p>`).join('');
  openModal("⚡ Fastest Finger Results!", `${summary}<p style="margin-top:14px; color:#4ade80; font-weight:bold;">${winner.name} wins the first Hot Seat turn!</p>`);

  document.getElementById('ffView').classList.add('hidden');
  document.getElementById('hotSeatView').classList.remove('hidden');
  phase = 'HOTSEAT';
  loadHotSeatQuestion();
}

function renderLadder() {
  const p = PLAYERS.at(activePlayerIdx);
  const el = document.getElementById('prizeLadder');
  el.innerHTML = LADDER.map((amt, i) => {
    let cls = 'rung';
    if (SAFE_RUNGS.includes(i)) cls += ' safe';
    if (i === p.rung) cls += ' current';
    else if (i < p.rung) cls += ' passed';
    return `<div class="${cls}"><span>${i + 1}</span><span>${amt}</span></div>`;
  }).join('');
}
function loadHotSeatQuestion() {
  inputLocked = false;
  const p = PLAYERS.at(activePlayerIdx);
  renderScoreboard();
  renderLadder();

  document.getElementById('life5050').disabled = !p.lifelines.f5050;
  document.getElementById('lifeSibling').disabled = !p.lifelines.sibling;
  document.getElementById('lifePoll').disabled = !p.lifelines.poll;

  let pool = p.tiers.easy;
  let tierLabel = 'EASY';
  if (p.rung >= 5 && p.rung < 10) {
    pool = p.tiers.medium;
    tierLabel = 'MEDIUM';
  } else if (p.rung >= 10) {
    pool = p.tiers.hard;
    tierLabel = 'HARD';
  }

  let available = pool.filter(item => !p.usedIds.includes(item.id));
  if (available.length === 0) {
    p.usedIds = p.usedIds.filter(id => !pool.some(item => item.id === id));
    available = pool;
  }

  currentQ = available.at(Math.floor(Math.random() * available.length));
  p.usedIds.push(currentQ.id);

  document.getElementById('qTopic').textContent = `${p.name} • ${tierLabel} • ${currentQ.cat}`;
  document.getElementById('questionText').textContent = currentQ.q;
  document.getElementById('feedbackMsg').textContent = '';

  const letters = new Array('A', 'B', 'C', 'D');
  document.getElementById('answersGrid').innerHTML = currentQ.opts.map((opt, i) => `
    <button class="ans-btn" id="optBtn${i}" onclick="submitAnswer(${i})">
      <span class="letter">${letters.at(i)}:</span> <span>${opt}</span>
    </button>
  `).join('');

  startShotClock();
}

function startShotClock() {
  clearInterval(timerInterval);
  timeLeft = 20;
  updateClockUI();
  timerInterval = setInterval(() => {
    if (!isPaused && !inputLocked) {
      timeLeft--;
      updateClockUI();
      if (timeLeft <= 5 && timeLeft > 0) SFX.tick();
      if (timeLeft <= 0) {
        clearInterval(timerInterval);
        handleWrongOrTimeout("⏰ Time's up!");
      }
    }
  }, 1000);
}

function updateClockUI() {
  const clock = document.getElementById('shotClock');
  clock.textContent = `${timeLeft}s`;
  clock.classList.toggle('danger', timeLeft <= 5);
}

function submitAnswer(chosenIdx) {
  if (inputLocked || isPaused) return;
  inputLocked = true;
  clearInterval(timerInterval);

  const p = PLAYERS.at(activePlayerIdx);
  const buttons = document.querySelectorAll('.ans-btn');
  buttons.forEach(b => b.disabled = true);

  if (chosenIdx === currentQ.ans) {
    buttons.item(chosenIdx).classList.add('correct');
    p.correctCount++;
    p.rung++;

    const wonAmount = LADDER.at(p.rung - 1);
    const currentBestIdx = LADDER.indexOf(p.bestCash);
    if (p.rung - 1 > currentBestIdx) p.bestCash = wonAmount;
    if (SAFE_RUNGS.includes(p.rung - 1)) p.safeRung = p.rung - 1;

    renderScoreboard();
    renderLadder();

    if (p.rung >= LADDER.length) {
      SFX.winMillion();
      document.getElementById('feedbackMsg').textContent = `🎉 ${p.name} WON $1,000,000! 🎉`;
      setTimeout(() => {
        p.rung = 0;
        p.safeRung = -1;
        p.lifelines = { f5050: true, sibling: true, poll: true };
        rotateTurn();
      }, 3000);
    } else {
      SFX.correct();
      document.getElementById('feedbackMsg').textContent = `✅ Correct! Moving up to ${LADDER.at(p.rung)}!`;
      setTimeout(loadHotSeatQuestion, 1600);
    }
  } else {
    buttons.item(chosenIdx).classList.add('wrong');
    handleWrongOrTimeout("❌ Wrong answer!");
  }
}

function handleWrongOrTimeout(reason) {
  inputLocked = true;
  SFX.wrong();
  document.querySelectorAll('.ans-btn').forEach(b => b.disabled = true);
  document.getElementById(`optBtn${currentQ.ans}`).classList.add('correct');

  const p = PLAYERS.at(activePlayerIdx);
  const dropRung = p.safeRung >= 0 ? p.safeRung + 1 : 0;
  const safeText = p.safeRung >= 0 ? `Safe Haven: ${LADDER.at(p.safeRung)}` : "$0";
  document.getElementById('feedbackMsg').textContent = `${reason} ${p.name} drops back to ${safeText}. Passing Hot Seat!`;

  p.rung = dropRung;
  p.lifelines = { f5050: true, sibling: true, poll: true };

  setTimeout(rotateTurn, 2500);
}

function rotateTurn() {
  activePlayerIdx = (activePlayerIdx + 1) % PLAYERS.length;
  loadHotSeatQuestion();
}

function use5050() {
  const p = PLAYERS.at(activePlayerIdx);
  if (!p.lifelines.f5050 || inputLocked || isPaused) return;
  p.lifelines.f5050 = false;
  document.getElementById('life5050').disabled = true;
  SFX.lifeline();

  const wrongIndices = new Array(0, 1, 2, 3).filter(i => i !== currentQ.ans).sort(() => Math.random() - 0.5);
  document.getElementById(`optBtn${wrongIndices.at(0)}`).classList.add('hidden-opt');
  document.getElementById(`optBtn${wrongIndices.at(1)}`).classList.add('hidden-opt');
}

function useSibling() {
  const p = PLAYERS.at(activePlayerIdx);
  if (!p.lifelines.sibling || inputLocked || isPaused) return;
  p.lifelines.sibling = false;
  document.getElementById('lifeSibling').disabled = true;
  SFX.lifeline();

  isPaused = true;
  openModal("🗣️ Ask a Sibling!", `<p>Timer paused! <strong>${p.name}</strong> has 30 seconds to ask a sibling for advice on this question.</p>`);
}

function usePoll() {
  const p = PLAYERS.at(activePlayerIdx);
  if (!p.lifelines.poll || inputLocked || isPaused) return;
  p.lifelines.poll = false;
  document.getElementById('lifePoll').disabled = true;
  SFX.lifeline();

  isPaused = true;
  const pcts = new Array(12, 11, 12, 12);
  pcts.splice(currentQ.ans, 1, 65);
  const letters = new Array('A', 'B', 'C', 'D');
  const bars = pcts.map((val, i) => `
    <div class="bar-col">
      <span style="font-size:0.85rem; margin-bottom:4px;">${val}%</span>
      <div class="bar-fill" style="height:${val * 1.6}px;"></div>
      <strong style="margin-top:6px;">${letters.at(i)}</strong>
    </div>
  `).join('');

  openModal("📊 Poll the Family", `<div class="poll-bars">${bars}</div>`);
}

function togglePause() {
  if (!document.getElementById('infoModal').classList.contains('hidden')) return;
  isPaused = !isPaused;
  document.getElementById('pauseOverlay').classList.toggle('hidden', !isPaused);
  document.getElementById('pauseBtn').textContent = isPaused ? '▶ Resume' : '⏸ Pause';
}

function openModal(title, html) {
  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalBody').innerHTML = html;
  document.getElementById('infoModal').classList.remove('hidden');
}

function closeModal() {
  document.getElementById('infoModal').classList.add('hidden');
  isPaused = false;
}

function showStandings() {
  if (phase === 'HOTSEAT') isPaused = true;
  const sorted = PLAYERS.slice().sort((a, b) => LADDER.indexOf(b.bestCash) - LADDER.indexOf(a.bestCash) || b.correctCount - a.correctCount);
  const rows = sorted.map((p, i) => `
    <div style="display:flex; justify-content:space-between; padding:10px; border-bottom:1px solid #334155;">
      <span><strong>#${i+1} ${p.name}</strong> - ${p.correctCount} right</span>
      <span style="color:#4ade80; font-weight:bold;">Best: ${p.bestCash}</span>
    </div>
  `).join('');
  openModal("🏆 Family Leaderboard", rows);
}

startFFTurn();
</script>
</body>
</html>
